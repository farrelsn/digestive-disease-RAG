<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digestive Health Assistant</title>
<style>
  body {
    margin: 0;
    font: 16px/1.6 system-ui, sans-serif;
    color: #1c2430;
    background: #f4f6f8;
  }
  header {
    background: #fff;
    border-bottom: 1px solid #dde3ea;
    padding: 16px 20px;
  }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; font-size: 13px; color: #5a6675; }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 20px;
  }

  .message { margin-bottom: 20px; }
  .question {
    background: #2f6f4e;
    color: #fff;
    padding: 10px 14px;
    border-radius: 12px;
    max-width: 80%;
    margin-left: auto;
    width: fit-content;
  }
  .answer {
    background: #fff;
    border: 1px solid #dde3ea;
    padding: 14px 16px;
    border-radius: 12px;
    white-space: pre-wrap;
  }
  .answer.pending { color: #5a6675; font-style: italic; }

  /* The [1] markers the model writes, turned into links to the source. */
  .citation {
    color: #2f6f4e;
    font-weight: 600;
    text-decoration: none;
  }
  .citation:hover { text-decoration: underline; }

  .sources {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #eceff3;
    font-size: 13px;
  }
  .sources h2 { margin: 0 0 6px; font-size: 13px; color: #5a6675; }
  .sources a { color: #2f6f4e; }
  .sources li { margin-bottom: 4px; }
  .reviewed { color: #8a95a3; }

  form {
    display: flex;
    gap: 8px;
    position: sticky;
    bottom: 0;
    background: #f4f6f8;
    padding: 12px 0;
  }
  input {
    flex: 1;
    padding: 12px 14px;
    font: inherit;
    border: 1px solid #c9d2dc;
    border-radius: 10px;
  }
  button {
    padding: 12px 20px;
    font: inherit;
    color: #fff;
    background: #2f6f4e;
    border: 0;
    border-radius: 10px;
    cursor: pointer;
  }
  button:disabled { background: #9db3a7; cursor: default; }

  footer {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 20px 30px;
    font-size: 12px;
    color: #8a95a3;
  }
</style>
</head>
<body>

<header>
  <h1>Digestive Health Assistant</h1>
  <p>Answers come only from NIDDK health articles, with a link to every page used.</p>
</header>

<main id="conversation"></main>

<main>
  <form id="ask-form">
    <!-- maxlength matches the server's cap, so the browser stops it before the server has to. -->
    <input id="question" placeholder="Ask about digestive health..." maxlength="500" autocomplete="off" autofocus>
    <button id="send">Ask</button>
  </form>
</main>

<footer>
  This is general published information, not medical advice. Talk to a doctor about your own health.
</footer>

<script>
const conversation = document.getElementById("conversation");
const form = document.getElementById("ask-form");
const input = document.getElementById("question");
const send = document.getElementById("send");

// Text from the model goes on the page as text, never as HTML.
function escapeHtml(text) {
  return text.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// Turn each [1] in the answer into a link to the page that source number came from.
function linkCitations(text, sources) {
  const urlByNumber = {};
  for (const source of sources) {
    for (const number of source.numbers) urlByNumber[number] = source.url;
  }
  return escapeHtml(text).replace(/\[(\d+)\]/g, (whole, number) => {
    const url = urlByNumber[number];
    return url ? `<a class="citation" href="${url}" target="_blank">[${number}]</a>` : whole;
  });
}

function sourceList(sources) {
  if (!sources.length) return "";
  const items = sources.map(source => {
    const labels = source.numbers.map(n => `[${n}]`).join("");
    const reviewed = source.last_reviewed ? ` <span class="reviewed">(${escapeHtml(source.last_reviewed)})</span>` : "";
    return `<li>${labels} <a href="${source.url}" target="_blank">${escapeHtml(source.title)}</a>${reviewed}</li>`;
  });
  return `<div class="sources"><h2>Sources</h2><ul>${items.join("")}</ul></div>`;
}

function addMessage(html) {
  const message = document.createElement("div");
  message.className = "message";
  message.innerHTML = html;
  conversation.append(message);
  message.scrollIntoView({ behavior: "smooth", block: "end" });
  return message;
}

form.addEventListener("submit", async event => {
  event.preventDefault();
  const question = input.value.trim();
  if (!question) return;

  addMessage(`<div class="question">${escapeHtml(question)}</div>`);
  input.value = "";
  send.disabled = true;

  const placeholder = addMessage(`<div class="answer pending">Searching the articles...</div>`);

  try {
    const response = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    // FastAPI puts the reason in "detail" — for example when the hourly limit is reached.
    if (!response.ok) {
      const problem = await response.json().catch(() => ({}));
      throw new Error(problem.detail || `Server returned ${response.status}`);
    }

    const result = await response.json();
    placeholder.innerHTML =
      `<div class="answer">${linkCitations(result.answer, result.sources)}${sourceList(result.sources)}</div>`;
  } catch (error) {
    placeholder.innerHTML = `<div class="answer">Something went wrong: ${escapeHtml(error.message)}</div>`;
  }

  send.disabled = false;
  input.focus();
});
</script>

</body>
</html>
